<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>TimeIt!</title>
</head>
<body>
    <div class="nav-section">
        <div class="logo">
        <h1>Time<br>It!</h1>
        </div>
        <div class="link-menu">
            <button>VisualizeIt!</button>
            <button>ConfigureIt!</button>
        </div>
    </div>

    <div class="hook">
        <h3 class="h3-hook">where's your times go?</h3>
        <h2 class="h2-hook">Time It <br> Up!</h2>
    </div>

    <div class="footer">
        <div class="footer-section--1">
            <div class="quotes-title">
                <h1>Dear Basketbal</h1>
            </div>
            <div class="quotes-main">
                <h2 class="quote">
                    From the moment I started
                    this integration, I knew
                    that this one is real.
                </h2>
                <h2 class="quote">
                    I gave you my all,
                    from my mind and body,
                    to my spirit and soul.
                </h2>
            </div>
        </div>

        <div class="footer-section--2">
            <div class="social-media">
                <img src="GitHub_logo.svg" alt="github-logo">
                <h2 class="username">ImNewbieBro</h2>
            </div>
        </div>
    </div>
</body>
</html>
